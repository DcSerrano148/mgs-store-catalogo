name: Actualizar catálogo JSON

on:
  push:
    branches: [main]
    paths:
      - 'datos/catalogo.csv'
      - 'datos/catalogo.xlsx'
      - 'datos/precios.csv'
      - 'datos/precios.xlsx'
      - 'scripts/generar_catalogo.py'
      - '.github/workflows/actualizar-catalogo.yml'
  workflow_dispatch:   # permite ejecutarlo manualmente desde GitHub

permissions:
  contents: write

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl

      - name: Generar catalogo.json
        run: python scripts/generar_catalogo.py

      - name: Verificar que el JSON se generó
        run: |
          if [ ! -f datos/catalogo.json ]; then
            echo "❌ No se generó datos/catalogo.json"
            exit 1
          fi
          echo "✅ JSON generado: $(wc -c < datos/catalogo.json) bytes"

      - name: Commit y push si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos/catalogo.json
          if git diff --staged --quiet; then
            echo "ℹ️  Sin cambios en catalogo.json"
          else
            git commit -m "🤖 Auto: regenerar catálogo [skip ci]"
            git push
            echo "✅ catalogo.json actualizado y subido"
          fi
