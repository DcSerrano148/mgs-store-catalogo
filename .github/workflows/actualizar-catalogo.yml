name: Actualizar catalogo JSON

on:
  push:
    branches: [main]
    paths:
      - 'datos/catalogo.csv'
      - 'datos/precios.csv'
      - 'scripts/generar_catalogo.py'
      - '.github/workflows/actualizar-catalogo.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install pandas

      - name: Generar catalogo.json
        run: python scripts/generar_catalogo.py

      - name: Commit y push si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos/catalogo.json
          if git diff --staged --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Auto: regenerar catalogo [skip ci]"
            git push
          fi